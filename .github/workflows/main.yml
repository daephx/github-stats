name: Generate Stats Images

on:
  push:
    branches:
      - main
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash -euxo pipefail {0}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2 tag
        with:
          version: 0.16.0

      - name: Build
        run: |
          zig build

      - name: Generate images
        run: |
          ./zig-out/bin/github-stats
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          EXCLUDE_REPOS: ${{ secrets.EXCLUDE_REPOS }}
          EXCLUDE_LANGS: ${{ secrets.EXCLUDE_LANGS }}
          EXCLUDE_PRIVATE: "false"
          EXCLUDE_INHERITED: "true"
          SILENT: "true"
          # TODO: Remove this when they get their API working again
          # https://github.com/orgs/community/discussions/192970
          MAX_RETRIES: 5

      - name: Deploy to generated branch
        run: |
          git config --global user.name "github-stats[bot]"
          git config --global user.email "github-stats[bot]@daephx.github.io"

          git checkout --orphan generated
          git rm -rf . 2>/dev/null || true

          git add overview.svg languages.svg
          git commit -m "Update generated stats images" || echo "No changes"
          git push origin generated --force
